<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="E.G.C Builder">
  <title>E.G.C Builder</title>
  <rect x="4" y="6" width="56" height="52" rx="6" fill="#272b31" stroke="#4ea1d3" stroke-width="2"/>
  <!-- cabinet carcass -->
  <rect x="12" y="14" width="18" height="36" fill="none" stroke="#e6e9ed" stroke-width="2"/>
  <line x1="12" y1="32" x2="30" y2="32" stroke="#9aa4b0" stroke-width="1.5"/>
  <!-- shelf lines -->
  <rect x="36" y="14" width="16" height="16" fill="none" stroke="#4ea1d3" stroke-width="2"/>
  <rect x="36" y="34" width="16" height="16" fill="none" stroke="#4ea1d3" stroke-width="2"/>
  <!-- worktop plane -->
  <line x1="8" y1="10" x2="56" y2="10" stroke="#4caf7d" stroke-width="3" stroke-linecap="round"/>
  <!-- hanging rod -->
  <line x1="14" y1="22" x2="28" y2="22" stroke="#e6e9ed" stroke-width="2" stroke-linecap="round"/>
</svg>
