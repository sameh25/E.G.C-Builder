<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>E.G.C Builder</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--ink:#1c1f24;--mut:#6b7280;--line:#e4e2da;--bg:#f6f4ee;--card:#fff;--acc:#b8862b;--acc2:#d9a441;--dark:#1c1f24;--ok:#177245;--bad:#b42318}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:13px/1.45 "Segoe UI",Tahoma,Arial,sans-serif;color:var(--ink);background:var(--bg);display:flex;flex-direction:column;overflow:hidden}
header{background:var(--dark);color:#fff;display:flex;align-items:center;gap:18px;padding:0 16px;height:52px;flex:none}
.brand{font-weight:700;letter-spacing:.14em;font-size:15px}.brand b{color:var(--acc2)}
.ver{font-size:10px;color:#9aa0a6;letter-spacing:0;margin-inline-start:6px}
nav{display:flex;gap:2px;flex:1}
nav button{background:none;border:0;color:#c9ccd1;padding:0 16px;height:52px;font:inherit;font-weight:600;cursor:pointer;border-bottom:3px solid transparent}
nav button.on{color:#fff;border-color:var(--acc2)}
nav button:hover{color:#fff}
.lang{display:flex;border:1px solid #444;border-radius:6px;overflow:hidden}
.lang button{background:none;color:#c9ccd1;border:0;padding:4px 12px;cursor:pointer;font:inherit}
.lang button.on{background:var(--acc);color:#fff}
main{flex:1;min-height:0;display:flex}
.tab{display:none;flex:1;min-height:0}.tab.on{display:flex}
.col{overflow:auto;padding:14px;min-height:0}
.left{width:430px;flex:none;border-inline-end:1px solid var(--line)}
.right{flex:1}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:12px}
.card h3{margin:0 0 10px;font-size:13px;letter-spacing:.02em;display:flex;align-items:center;gap:8px}
.card h3:before{content:"";width:4px;height:14px;background:var(--acc);border-radius:2px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px 10px}
label.f{display:flex;flex-direction:column;gap:3px;color:var(--mut);font-size:11.5px}
label.f span.u{color:#9aa0a6}
input[type=number],input[type=text],select{font:inherit;color:var(--ink);border:1px solid #d5d2c7;border-radius:6px;padding:5px 8px;background:#fff;width:100%;min-width:0}
input:focus,select:focus{outline:2px solid #e9d29f;border-color:var(--acc)}
input[type=color]{width:100%;height:30px;border:1px solid #d5d2c7;border-radius:6px;padding:2px;background:#fff}
input[type=checkbox]{accent-color:var(--acc)}
.chk{display:flex;align-items:center;gap:6px;color:var(--ink);font-size:12.5px}
button.btn{font:inherit;font-weight:600;border:1px solid #cfcabb;background:#fff;color:var(--ink);border-radius:8px;padding:7px 14px;cursor:pointer}
button.btn:hover{border-color:var(--acc)}
button.pri{background:var(--acc);border-color:var(--acc);color:#fff}button.pri:hover{background:#a3761f}
button.dark{background:var(--dark);border-color:var(--dark);color:#fff}
button.sm{padding:3px 9px;font-size:12px;border-radius:6px}
.seg{display:flex;gap:6px}.seg button{flex:1}
.seg button.on{background:var(--dark);color:#fff;border-color:var(--dark)}
.stack{display:flex;flex-direction:column;border:1px solid #cfcabb;border-radius:8px;overflow:hidden;height:250px;font-size:11px}
.stack div{display:flex;align-items:center;justify-content:space-between;padding:0 10px;color:#222;border-bottom:1px solid #fff8}
.stack .sf{background:#d9d3c2}.stack .s2{background:#e8d8b0}.stack .s1{background:#efe1bd}.stack .sg{background:repeating-linear-gradient(45deg,#f6f4ee,#f6f4ee 6px,#efece2 6px,#efece2 12px);color:#777}.stack .sb{background:#d8c9ae}.stack .sp{background:#bdb59f}
.warn{color:var(--bad);font-weight:600;font-size:12px}
.hint{color:var(--mut);font-size:11.5px}
table.t{width:100%;border-collapse:collapse;font-size:12.5px}
table.t th{background:#f0ece0;text-align:start;padding:6px 8px;font-weight:600;position:sticky;top:0}
table.t td{padding:4px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
table.t td input,table.t td select{padding:3px 6px}
.runtabs{display:flex;gap:6px;margin-bottom:10px;align-items:center}
.runtabs button.on{background:var(--dark);color:#fff;border-color:var(--dark)}
.bar{height:10px;border-radius:5px;background:#e6e2d4;overflow:hidden;margin:6px 0}
.bar i{display:block;height:100%;background:var(--acc2)}.bar.over i{background:var(--bad)}
.actions{position:sticky;bottom:0;background:linear-gradient(0deg,var(--bg) 70%,#0000);padding-top:10px;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.chip{display:inline-block;background:#efe1bd;border-radius:10px;padding:1px 8px;font-size:11px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px}.kpi .k{color:var(--mut);font-size:11.5px}.kpi .v{font-size:20px;font-weight:700}
#toast{position:fixed;bottom:16px;inset-inline-start:50%;transform:translateX(-50%);background:var(--dark);color:#fff;padding:9px 18px;border-radius:9px;opacity:0;transition:.25s;pointer-events:none;z-index:9;max-width:80%}
#toast.on{opacity:1}#toast.err{background:var(--bad)}
.sel{background:#fff7e0;border:1px dashed var(--acc);border-radius:10px;padding:10px 12px;margin-bottom:12px}
.scroll{overflow:auto;max-height:340px;border:1px solid var(--line);border-radius:8px;background:#fff}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:12px}
.ccard{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;transition:.15s}
.ccard:hover{border-color:var(--acc);box-shadow:0 4px 14px #0001}
.ccard .th{height:128px;background:#f1efe7;display:flex;align-items:center;justify-content:center;overflow:hidden}
.ccard .th img{max-width:100%;max-height:100%;object-fit:contain;mix-blend-mode:multiply}
.ccard .th img.rp{mix-blend-mode:normal;width:100%;height:100%}
.ccard .th svg{height:112px;width:auto}
.ccard .bd{padding:8px 10px;display:flex;flex-direction:column;gap:5px;flex:1}
.ccard .nm{font-weight:600;font-size:12.5px;line-height:1.3;min-height:32px}
.ccard .mt{color:var(--mut);font-size:11px}
.ccard .bt{display:flex;gap:5px;flex-wrap:wrap;margin-top:auto}
.ccard select,.ccard input[type=number]{padding:2px 6px;font-size:12px}
.pills{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 12px}
.pills button{font:inherit;border:1px solid #d5d2c7;background:#fff;border-radius:16px;padding:3px 12px;cursor:pointer}
.pills button.on{background:var(--dark);color:#fff;border-color:var(--dark)}
.topbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;position:sticky;top:-14px;background:var(--bg);padding:10px 0 2px;z-index:2}
.topbar input[type=search]{font:inherit;border:1px solid #d5d2c7;border-radius:8px;padding:6px 10px;min-width:220px}
.motion{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:6px 12px}
.motion input[type=range]{accent-color:var(--acc);width:180px}
.sw{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
.sw button{border:1px solid #d5d2c7;background:#fff;border-radius:8px;padding:0;cursor:pointer;text-align:center;overflow:hidden;font:inherit}
.sw button i{display:block;height:44px}.sw button span{display:block;font-size:10.5px;padding:3px 4px;line-height:1.2}
.sw button:hover{border-color:var(--acc)}
.sw button.on{border-color:var(--acc);box-shadow:0 0 0 2px #e9d29f}
#modal{position:fixed;inset:0;background:#0007;display:none;align-items:center;justify-content:center;z-index:20}
#modal.on{display:flex}
#modal .box{background:var(--bg);border-radius:14px;width:min(860px,92vw);max-height:86vh;overflow:auto;padding:14px 16px}
/* ---------- responsive layout (REFLOWS - not clipped, not just scrollbars) ---------- */
header{flex-wrap:wrap;height:auto;min-height:52px}
nav{flex-wrap:wrap;min-width:0}
.topbar input[type=search]{min-width:0;flex:1 1 160px}
.cgrid{grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr))}
.sw{grid-template-columns:repeat(auto-fill,minmax(min(100%,88px),1fr))}
.card,.sel{min-width:0}
img,svg{max-width:100%}
@media (max-width:1180px){
  .left{width:360px}
  .kpis{grid-template-columns:repeat(2,1fr)}
}
@media (max-width:980px){
  /* stacked (single-column) layout: MAIN itself is the one scrollable region (contained overflow), never the page/body -
     the CEF dialog does not reliably support document-level scroll with the mouse wheel or a real scrollbar drag. */
  main{overflow-y:auto;overflow-x:hidden;display:block}
  .tab.on{display:flex;flex-direction:column;width:100%;min-width:0}
  .col{overflow:visible;min-height:0}
  .left{width:100%;border-inline-end:0;border-bottom:1px solid var(--line)}
  .right{flex:none;width:100%}
  header{padding:4px 10px;gap:8px 12px}
  nav button{height:38px;padding:0 10px}
  .grid3{grid-template-columns:1fr 1fr}
  .cgrid{gap:10px}
  .ccard .th{height:112px}
  .motion input[type=range]{width:120px}
  table.t{display:block;overflow-x:auto;max-width:100%}
  .scroll{max-height:280px}
}
@media (max-width:700px){
  .grid,.grid3{grid-template-columns:1fr 1fr}
  .kpis{grid-template-columns:repeat(2,1fr)}
  .ccard .th{height:100px}
  .ccard .nm{min-height:0}
  .actions{justify-content:stretch}.actions .btn{flex:1 1 auto}
  #modal .box{width:96vw;padding:10px}
}
@media (max-width:520px){
  body{font-size:12.5px}
  .grid,.grid3,.kpis{grid-template-columns:1fr}
  .cgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .topbar{position:static}
  .lang button{padding:3px 9px}
  .brand{font-size:13px}
  nav{flex:1 1 100%;order:3}
  nav button{flex:1 1 auto;padding:0 6px}
}
@media (max-width:700px){
  table.stackrows,table.stackrows tbody,table.stackrows tr,table.stackrows td{display:block;width:100%}
  table.stackrows thead{display:none}
  table.stackrows tr{display:grid;grid-template-columns:1fr 1fr;gap:4px 8px;border:1px solid var(--line);border-radius:8px;padding:6px 8px;margin-bottom:8px;background:#fff}
  table.stackrows td{border:0;padding:2px 0}
  table.stackrows td[data-l]::before{content:attr(data-l);display:block;color:var(--mut);font-size:11px}
  table.stackrows td:first-child{grid-column:1/-1;font-weight:700}
  table.stackrows td:last-child{grid-column:1/-1}
}
@media (max-width:440px){
  .cgrid{grid-template-columns:1fr}
  .ccard{flex-direction:row}
  .ccard .th{width:42%;height:auto;min-height:100px;flex:none}
}
/* ---------- always-accessible header + critical actions (1.16.1) ---------- */
@media (max-width:980px){
  .actions{z-index:20}
}
@media (max-width:520px){
  header{padding:2px 8px;gap:2px 8px;min-height:0}
  nav button{height:30px;padding:0 6px;font-size:12px;border-bottom-width:2px}
  .brand{font-size:12px;letter-spacing:.08em}
  .lang button{padding:2px 7px;font-size:12px}
  .actions{gap:5px;padding-top:6px}
  .actions .btn{padding:4px 8px;font-size:12px;flex:1 1 auto}
}
@media (max-height:560px) and (max-width:980px){
  nav{flex:1 1 100%}
}
/* ---------- true small-window reflow (1.16.3) ----------
   A 420 x 480 window is only 280 x 320 CSS px at 150 % Windows scaling (336 x 384 at 125 %): the header must stay compact, long labels wrap,
   nothing may be wider than the window and scrollIntoView must not park an element under the sticky header. */
html{scroll-padding-top:var(--hh,0px)}
button,select,input,textarea{max-width:100%}
.pills button,.seg button,.runtabs button,.btn{white-space:normal;overflow-wrap:break-word}
.seg{flex-wrap:wrap}.seg button{flex:1 1 74px;min-width:0}
.runtabs{flex-wrap:wrap}
.motion{flex-wrap:wrap}
.motion input[type=range]{flex:1 1 90px;min-width:60px;width:auto}
@media (max-width:520px){
  .ver{display:none}
  header{row-gap:0}
  nav{gap:0}
  nav button{height:26px;padding:0 4px;font-size:11.5px}
  .brand{font-size:11.5px}
  .col{padding:8px}
  .card{padding:8px 10px;margin-bottom:8px}
}
/* ---------- density tiers (1.16.5): the small window is REDESIGNED, not just scrolled ----------
   tier 1 (<=520 px wide OR <=560 px high): compact header (brand + language on one row, ONE scrolling tab strip), smaller controls, tighter cards, 1-column forms
   tier 2 (<=420 px wide): cards become accordions (first one open), the catalogue shows 2 thumbnails per row
   tier 3 (<=340 px wide): brand shortened, catalogue and forms strictly 1 column                                                                */
@media (max-width:520px),(max-height:560px){
  body{font-size:12px}
  header{padding:0 8px;gap:2px 8px;min-height:0;height:auto}
  .brand{font-size:12px;letter-spacing:.05em}
  .ver{display:none}
  nav{flex:1 1 100%;order:3;flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;gap:0;min-width:0}
  nav::-webkit-scrollbar{display:none}
  nav button{flex:0 0 auto;height:27px;padding:0 9px;font-size:12px;border-bottom-width:2px}
  .lang button{padding:2px 8px;font-size:12px}
  .col{padding:7px}
  .card{padding:6px 9px;margin-bottom:7px;border-radius:8px}
  .card h3{font-size:12px;margin:0 0 5px;gap:6px}
  .card h3:before{height:11px}
  .grid,.grid3{gap:4px 8px}
  label.f{gap:1px;font-size:10.5px}
  input[type=number],input[type=text],select,.topbar input[type=search]{padding:1px 6px;font-size:12px;height:25px;border-radius:5px}
  button.btn{padding:3px 9px;font-size:12px;border-radius:6px}
  button.btn.sm{padding:2px 7px}
  .chk{font-size:12px}
  .pills{margin:4px 0 7px;gap:4px}.pills button{padding:2px 9px;font-size:12px}
  .cgrid{gap:7px}
  .ccard .th{height:92px}.ccard .bd{padding:5px 7px;gap:3px}.ccard .nm{font-size:12px;min-height:0}
  .kpi{padding:5px 8px}.kpi .v{font-size:15px}
  .topbar{padding:4px 0 2px;gap:6px}
  .seg{gap:4px}
  #kLeft .grid,#kLeft .grid3{grid-template-columns:1fr 1fr}
}
@media (max-width:460px){
  .cgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .ccard{flex-direction:column}
  .ccard .th{width:auto;height:96px;min-height:0}
  .grid,.grid3,.kpis,#kLeft .grid,#kLeft .grid3{grid-template-columns:1fr}
  .narrow .card>h3{cursor:pointer;user-select:none}
  .narrow .card>h3:after{content:"\25BE";margin-inline-start:auto;opacity:.55}
  .narrow .card.collapsed>h3:after{content:"\25B8"}
  .narrow .card.collapsed>*:not(h3){display:none!important}
  .narrow .card.collapsed{padding-bottom:6px}
  .narrow .card.collapsed>h3{margin-bottom:0}
  .narrow #asCol .stg{display:none!important}
  .narrow #asCol h2{font-size:15px}
  .narrow #asCol>.hint{display:none!important}
}
@media (max-width:340px){
  .brand b{display:none}
  .cgrid{grid-template-columns:1fr}
  .ccard{flex-direction:row}
  .ccard .th{width:42%;height:auto;min-height:84px;flex:none}
  .col{padding:5px}
}
/* on a very short window a stacked-full-width action bar (e.g. Kitchen's 5 buttons) can eat most of the viewport while
   pinned sticky, hiding whatever it sits on top of; let it scroll away with the content instead once the window is this short. */
@media (max-height:420px){
  .actions{position:static;background:none}
}
@media (max-width:520px),(max-height:560px){
  nav{overflow:hidden!important}
  nav button.nvh{display:none!important}
  nav button.nvmore{flex:0 0 auto;margin-inline-start:auto;height:27px;padding:0 12px;font-size:16px;line-height:1;color:#fff;border-bottom:2px solid transparent}
}
#navMenu{position:fixed;z-index:60;background:#1c1f24;border:1px solid #555;border-radius:8px;padding:4px;display:flex;flex-direction:column;min-width:150px;box-shadow:0 8px 24px #0008}
#navMenu button{background:none;border:0;color:#e8eaed;text-align:start;padding:7px 10px;font:inherit;font-size:13px;cursor:pointer;border-radius:5px}
#navMenu button:hover{background:#33373f}
nav button.nvmore{display:none}
@media (max-width:520px),(max-height:560px){nav button.nvmore{display:block}}
@media (max-width:300px){ /* 200 % Windows scaling at the minimum window (420 device px = 210 CSS px) */
  input,select,textarea{min-width:0;width:100%}
  input[type=checkbox],input[type=radio]{width:auto}
  .row>*,.f,label{min-width:0;flex:1 1 100%}
  .grid,.grid3,.kpis,.cgrid{grid-template-columns:1fr}
  .actions .btn,.btn{flex:1 1 100%}
  .col{padding:6px}
  body{font-size:12px}
}
/* small "Edit Unit" popup: only the selected-unit fields, no nav/other tabs/kitchen-mode switch */
body.popup-mode nav,body.popup-mode #kmodeBar,body.popup-mode .brand{display:none}
body.popup-mode header{justify-content:flex-end}
body.popup-mode main{padding:8px}
body.popup-mode .col{padding:8px}
body.popup-mode .grid3{grid-template-columns:1fr 1fr}
body.popup-mode .sel .grid3{grid-template-columns:1fr 1fr 1fr}
</style>
</head>
<body>
<header>
  <div class="brand">E.G.C <b>BUILDER</b><span class="ver" id="ver"></span></div>
  <nav id="nav"></nav>
  <div class="lang" id="kmodeBar" style="display:none"><button data-km="kitchen" data-t="tabs.kitchen"></button><button data-km="dressing" data-t="tabs.ward"></button></div>
  <div class="lang" id="languageBar"><button data-l="ar">ع</button><button data-l="en">EN</button></div>
</header>
<main>
  <!-- ============ KITCHEN ============ -->
  <section class="tab on" id="tab-kitchen">
    <div class="col left" id="kLeft"></div>
    <div class="col right">
      <div class="card">
        <h3 data-t="units"></h3>
        <div class="runtabs" id="runtabs"></div>
        <div style="display:flex;gap:12px;align-items:end;margin-bottom:8px;flex-wrap:wrap">
          <label class="f" style="width:150px"><span data-t="run_len"></span><input type="number" id="runLen" step="10"></label>
          <label class="chk"><input type="checkbox" id="afFridge" checked><span data-t="with_fridge"></span></label>
          <label class="chk"><input type="checkbox" id="afTower"><span data-t="with_tower"></span></label>
          <button class="btn sm" id="btnAuto" data-t="autofill"></button>
          <button class="btn sm" id="btnAdd" data-t="add_unit"></button>
          <button class="btn sm" id="btnClear" data-t="clear"></button>
        </div>
        <div class="bar" id="fillBar"><i></i></div>
        <div class="hint" id="fillTxt"></div>
        <div class="scroll" style="margin-top:8px;max-height:none">
          <table class="t stackrows"><thead><tr><th>#</th><th data-t="c_type"></th><th style="width:86px" data-t="c_w"></th><th data-t="c_w1"></th><th data-t="c_w2"></th><th style="width:96px"></th></tr></thead><tbody id="rows"></tbody></table>
        </div>
      </div>
      <div class="actions">
        <button class="btn" id="btnLoad" data-t="load_kitchen"></button>
        <button class="btn" id="btnReplace" data-t="replace"></button>
        <button class="btn dark" id="btnGen" data-t="gen_origin"></button>
        <button class="btn" id="btnKitchenRun" data-t="kitchen_run"></button>
        <button class="btn pri" id="btnPlace" data-t="place"></button>
      </div>
    </div>
  </section>

  <!-- ============ DRESSING / WARDROBE (shown instead of Kitchen via the mode switch) ============ -->
  <section class="tab" id="tab-ward"><div class="col" style="flex:1" id="wCol"></div></section>

  <!-- ============ UNITS (catalog units + single-unit insert/edit) ============ -->
  <section class="tab" id="tab-units" style="flex-direction:column;overflow:auto"><div id="uCol" style="padding:14px"></div></section>

  <!-- ============ WORKTOP (compact popup: edits the worktop of the selected unit's run) ============ -->
  <section class="tab" id="tab-worktop" style="flex-direction:column;overflow:auto"><div id="wtCol" style="padding:14px"></div></section>

  <!-- ============ MECHANISMS ============ -->
  <section class="tab" id="tab-mech"></section>

  <!-- ============ APPLIANCES ============ -->
  <section class="tab" id="tab-app"></section>

  <!-- ============ MATERIALS ============ -->
  <section class="tab" id="tab-mat"></section>

  <!-- ============ PRODUCTION (cutlist + docs + Advanced: view/scenes/audit/settings) ============ -->
  <section class="tab" id="tab-prod"><div style="padding:14px;overflow:auto;display:flex;flex-direction:column;flex:1" id="prodWrap">
    <div id="cCol"></div>
    <div id="tCol"></div>
  </div></section>

  <!-- ============ CATALOG (single shared container, relocated into whichever of the 4 tabs above is active) ============ -->
  <div class="col" style="flex:1;display:none" id="catCol"></div>
</main>
<div id="modal"><div class="box" id="modalBox"></div></div>
<div id="toast"></div>

<script>
/* ---------- dev fallback (only when opened outside SketchUp) ---------- */
if (!window.sketchup) {
  window.__mock = true;
  window.sketchup = new Proxy({}, { get: (t, k) => (...a) => { console.log('sketchup.' + k, a); } });
